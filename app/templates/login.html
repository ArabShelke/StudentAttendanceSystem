
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AttendEase - Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 360px;
            max-width: calc(100% - 48px);
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #64748b;
        }

        .login-form label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #334155;
        }

        .login-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        .login-form button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-form button:hover {
            background: #1d4ed8;
        }

        .login-error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-header">
            <h1>🎓 AttendEase</h1>
            <p>Student Attendance Management System</p>
            <h3>Admin Login</h3>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="login-error">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form action="/login" method="POST" class="login-form">

            <label>Username</label>

            <input type="text"
                   name="username"
                   placeholder="Enter admin username"
                   required>

            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Enter password"
                   required>

            <button type="submit">Login</button>

        </form>

        <div class="login-footer">
            © 2026 AttendEase. All rights reserved.
        </div>

    </div>

</body>
</html>
